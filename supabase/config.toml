# Supabase CLI configuration for local development (`supabase start`).
# Hosted project settings must be mirrored in the dashboard — see docs/SECURITY.md.
project_id = "traningapp"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:4173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Private app: no self sign-up. Create the account in Studio / the dashboard.
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[auth.rate_limit]
sign_in_sign_ups = 30
token_refresh = 150

[auth.email]
enable_signup = false
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true

[storage]
enabled = true
# No buckets are created. Private health files must never use a public bucket.
